<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WA Canvas</title><link rel="stylesheet" href="../ui/base.css"><link rel="stylesheet" href="popup.css"></head><body>
<main><header><div class="brand"><img src="../assets/logo.svg" alt=""><div><strong>WA Canvas</strong><span>Local interface controls</span></div></div><label class="switch" title="Enable extension"><input id="enabled" type="checkbox"><i></i></label></header>
<section class="status"><div><span class="status-dot"></span><b id="status-title">Ready</b></div><small>Visual changes stay in this browser.</small></section>
<section class="quick-grid"><button data-toggle="privacy.panicMode"><span>◉</span><b>Panic</b><small>Hide everything</small></button><button data-toggle="productivity.focusMode"><span>◎</span><b>Focus</b><small>Dim sidebar</small></button><button data-toggle="productivity.zenMode"><span>◇</span><b>Zen</b><small>Chat only</small></button><button data-toggle="privacy.blurConversation"><span>◌</span><b>Blur chat</b><small>Hover to reveal</small></button><button data-toggle="productivity.sidebarCollapsed"><span>◫</span><b>Sidebar</b><small>Collapse locally</small></button><button data-toggle="aiPanel.open"><span>✦</span><b>AI panel</b><small>Future-ready</small></button></section>
<section class="theme-row"><label for="theme">Theme</label><select id="theme"></select></section>
<footer><button id="open-options" class="primary">Open full settings</button><button id="open-whatsapp" class="secondary">Open WhatsApp Web</button></footer></main><div id="toast" class="toast"></div><script type="module" src="popup.js"></script></body></html>
